<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            background-color: #EAEAEA;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            font-family: 'Inter', sans-serif;
            color: #2B2D42;
            position: relative;
            overflow: hidden;
        }
        .left-panel {
            grid-column: 1 / 4;
            grid-row: 1 / 7;
            background-color: #1E3A8A;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-top: 60px;
            padding-left: 80px;
            z-index: 2;
        }
        .right-panel {
            grid-column: 4 / 7;
            grid-row: 1 / 7;
            position: relative;
            z-index: 1;
        }
        .hero-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-left: 8px solid #B58900;
        }
        .logo-area {
            margin-bottom: 40px;
        }
        .logo-circle {
            width: 60px;
            height: 60px;
            border: 3px solid #B58900;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #B58900;
            font-size: 24px;
            margin-bottom: 20px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 84px;
            font-weight: 700;
            color: #FFFFFF;
            letter-spacing: -2px;
            line-height: 1;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        .subtitle {
            font-family: 'Inter', sans-serif;
            font-size: 22px;
            font-weight: 300;
            color: #B58900;
            text-transform: lowercase;
            letter-spacing: 2px;
            margin-bottom: 60px;
            max-width: 400px;
        }
        .tagline {
            font-size: 16px;
            color: #FFFFFF;
            opacity: 0.8;
            border-left: 4px solid #B58900;
            padding-left: 20px;
            margin-top: 20px;
        }
        .footer-info {
            position: absolute;
            bottom: 40px;
            left: 80px;
            color: #FFFFFF;
            font-size: 12px;
            opacity: 0.6;
        }
        .accent-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: #B58900;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="accent-bar"></div>
        <div class="left-panel">
            <div class="logo-area">
                <div class="logo-circle">
                    <i class="fas fa-satellite-dish"></i>
                </div>
            </div>
            <h1>Órbita</h1>
            <div class="subtitle">planejamento visual e gestão multi-tenant</div>
            <div class="tagline">
                governança, ia e operações geoespaciais<br>
                em um único ecossistema corporativo.
            </div>
        </div>
        <div class="right-panel">
            <img src="/manus-storage/orbita-commercial-hero_1eedd802.png" class="hero-image" alt="Órbita Hero Visual">
        </div>
        <div class="footer-info">
            LS SOLUTIONS · 2026 · DOCUMENTO CONFIDENCIAL
        </div>
    </div>
</body>
</html>
